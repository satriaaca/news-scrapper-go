name: Tabanan News Scraper (Go)

on:
  schedule:
    # Berjalan otomatis setiap hari jam 08:00 UTC (16:00 WITA)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write # wajib agar GITHUB_TOKEN boleh push ke repo

concurrency:
  group: tabanan-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Tahap 1 - Fetch RSS ke JSON
        run: go run 1_fetch_rss.go

      - name: Tahap 2 - Process & Scrape (Chromedp)
        id: scrape_step
        run: go run main.go

      - name: Simpan CSV sebagai Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabanan-news-data
          path: output/**/*.csv
          retention-days: 7

      - name: Commit & Push hasil ke repository
        if: always()
        run: |
          DATE=$(TZ=Asia/Makassar date +'%Y-%m-%d')
          mkdir -p output/success output/failed

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "--- Files changed by the scrape ---"
          git status --short

          git add output/success/*.csv output/failed/*.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "chore: scrape result $DATE [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
